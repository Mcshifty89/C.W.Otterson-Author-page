<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | C. W. Otterson</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="site-header-inner">
            <div class="site-title-wrap">
                <a class="header-back" href="javascript:history.back()" aria-label="Go back">&#8592;</a>
                <h1 class="site-title">
                    <a href="index.html">C. W. OTTERSON</a>
                </h1>
            </div>

            <nav class="site-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="books.html">BOOKS</a></li>
                    <li><a href="contact.html" class="active">CONTACT</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-layout">
        <section class="contact-info">
            <p class="eyebrow">Get in touch</p>
            <h3>For speaking engagements, interviews, and reader inquiries.</h3>
            <p>
                Whether you are a bookseller, event organizer, or a reader who wants to connect,
                I would love to hear from you.
            </p>
            <button class="back-button" type="button" onclick="history.back()">Back</button>
        </section>

        <form class="contact-form" action="mailto:essen2561@yahoo.com" method="post" enctype="text/plain">
            <label>
                Name
                <input type="text" name="name" placeholder="Your name">
            </label>

            <label>
                Email
                <input type="email" name="email" placeholder="your@email.com">
            </label>

            <label>
                Message
                <textarea name="message" placeholder="Write your message here..."></textarea>
            </label>

            <button type="submit">Send message</button>
        </form>
    </main>

    <footer class="site-credit">
        <img class="site-watermark" src="Mason-Symbol.png" alt="" aria-hidden="true">
        <span>Designed by <a href="#">Hi-end pro</a></span>
        <img class="site-footer-mark" src="ASTSlogo.jpg" alt="ASTS logo" aria-label="ASTS logo">
    </footer>
</body>

</html>
